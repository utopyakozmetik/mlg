<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multilayergod</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime&family=IM+Fell+English&display=swap" rel="stylesheet">
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-title">Dil Seç</div>
  <div class="lang-grid">
    <div class="lang"><img src="assets/images/lang/tr.png"></div>
    <div class="lang"><img src="assets/images/lang/en.png"></div>
    <div class="lang"><img src="assets/images/lang/fr.png"></div>
  </div>
</div>

<!-- BACKGROUND -->
<div id="bg"></div>

<!-- RANSOM HEADER EFFECT -->
<div id="ransom-root"></div>

<!-- MAIN LAYOUT -->
<div class="container">

  <!-- INDEX -->
  <div id="left-archive"></div>

  <!-- FEED -->
  <main id="timeline"></main>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <img src="assets/images/ff/falanfilan.png" style="max-width:200px">

    <!-- PLAYER -->
    <div class="player">

      <div class="track-name" id="trackName">—</div>

      <div class="controls">
        <button id="prevTrack">⏮</button>
        <button id="playPause">▶</button>
        <button id="nextTrack">⏭</button>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

    </div>

    <audio id="globalAudio"></audio>

    <!-- LINKS -->
    <div class="links">

      <div class="links-title">Müzik Projeleri</div>

      <a href="https://sanr.bandcamp.com" target="_blank">Sanr Bandcamp</a>
      <a href="https://flamingpines.bandcamp.com/album/mnk" target="_blank">FenGi Album</a>

    </div>

  </aside>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <button id="prevPost" class="nav-btn prev">←</button>
  <button id="nextPost" class="nav-btn next">→</button>

  <button id="closeModal" class="exit">Çıkış</button>

  <div class="modal-grid">

    <!-- MEDIA -->
    <div id="modal-media"></div>

    <!-- TEXT -->
    <div id="modal-side"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
