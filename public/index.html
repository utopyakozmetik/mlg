<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multilayergod</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime&family=IM+Fell+English&display=swap" rel="stylesheet">
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-title">Dil Seç</div>

  <div class="lang-grid">
    <div class="lang"><img src="assets/images/lang/tr.png"></div>
    <div class="lang"><img src="assets/images/lang/en.png"></div>
    <div class="lang"><img src="assets/images/lang/fr.png"></div>
  </div>
</div>

<div id="bg"></div>

<div class="container">

  <div id="left-archive"></div>

  <main id="timeline"></main>

  <aside class="sidebar">

    <img src="assets/images/ff/falanfilan.png" style="max-width:200px">

    <!-- PLAYER -->
    <div class="player">

      <div id="trackName" class="track-name">—</div>

      <div class="controls">
        <button id="prevTrack">⏮</button>
        <button id="playPause">▶</button>
        <button id="nextTrack">⏭</button>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

    </div>

    <audio id="globalAudio"></audio>

    <!-- MÜZİK BAŞLIK IMAGE -->
    <div class="links">
      <img src="public/assets/images/muzikprojelerilinkleri.png" class="links-title-img">

      <a href="https://sanr.bandcamp.com" target="_blank">Sanr Bandcamp</a>
      <a href="https://flamingpines.bandcamp.com/album/mnk" target="_blank">FenGi Album</a>
    </div>

  </aside>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">

  <img id="prevPost" class="nav-btn prev" src="public/assets/images/oncekigonderi.png">
  <img id="nextPost" class="nav-btn next" src="public/assets/images/sonrakigonderi.png">
  <img id="closeModal" class="exit" src="public/assets/images/cikis.png">

  <div class="modal-grid">
    <div id="modal-media"></div>
    <div id="modal-side"></div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
