<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilayergod</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🌐 INTRO -->
<div id="intro">
  <div class="intro-title">Language Selection</div>

  <div class="lang-grid">
    <div class="lang"><img src="/assets/images/lang/tr.png"></div>
    <div class="lang"><img src="/assets/images/lang/en.png"></div>
    <div class="lang"><img src="/assets/images/lang/fr.png"></div>
  </div>
</div>

<div id="bg"></div>

<div class="container">

  <div id="left-archive"></div>

  <main id="timeline"></main>

  <aside class="sidebar">

    <div id="sidebar-title">
      <img src="/assets/images/ff/falanfilan.png">
    </div>

    <!-- 🎧 PLAYER -->
    <div id="music-player">
      <audio id="audio" controls>
        <source src="/assets/music/sample.mp3">
      </audio>

      <div class="controls">
        <button id="prevTrack">⏮</button>
        <button id="nextTrack">⏭</button>
      </div>
    </div>

  </aside>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <button id="closeModal">✕</button>
    <button id="prevPost">←</button>
    <button id="nextPost">→</button>

    <div class="modal-grid">
      <div id="modal-media"></div>
      <div id="modal-side"></div>
    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
