<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilayergod</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bg"></div>

<div class="container">

  <!-- SOL ARCHIVE -->
  <div id="left-archive"></div>

  <!-- FEED -->
  <main id="timeline"></main>

  <!-- SAĞ PANEL -->
  <aside class="sidebar">

    <div id="sidebar-title">
      <img src="/assets/images/ff/falanfilan.png" alt="falan filan">
    </div>

    <div class="links">
      <div class="links-title">Linkler:</div>

      <a href="https://sanr.bandcamp.com" target="_blank">
        sanr bandcamp
      </a>

      <a href="https://flamingpines.bandcamp.com/album/mnk" target="_blank">
        FenGi album
      </a>
    </div>

  </aside>

</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">

    <button id="closeModal">✕</button>
    <button id="prevPost">←</button>
    <button id="nextPost">→</button>

    <div class="modal-grid">
      <div id="modal-media"></div>
      <div id="modal-side"></div>
    </div>

  </div>
</div>

<script src="script.js" defer></script>

</body>
</html>
