<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultilayerGod TV</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tv">

    <img src="tv.jpg" id="tvImage" alt="TV">

    <div id="screenFrame">

        <iframe
            id="player"
            allow="autoplay; fullscreen"
            allowfullscreen
            frameborder="0">
        </iframe>

        <div id="scanlines"></div>

        <div id="channelText">
            VIDEO 1
        </div>

    </div>

    <div id="prevBtn" title="Önceki Video"></div>
    <div id="nextBtn" title="Sonraki Video"></div>

</div>

<script src="app.js"></script>

</body>
</html>
